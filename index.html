<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romeo & Juliet Game Hub</title>
    <style>
        :root {
            --burgundy: #79081cff;
            --brick-ember: #c80000ff;
            --pumpkin-spice: #ff6f00ff;
            --lilac: #ccabd6ff;
            --velvet-orchid: #6d378fff;
            --indigo: #400095ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, var(--velvet-orchid) 0%, var(--indigo) 100%);
            min-height: 100vh;
            color: #333;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .setup-screen {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .team-setup {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .team-input {
            padding: 15px;
            border: 2px solid var(--velvet-orchid);
            border-radius: 10px;
            background: #f8f9ff;
        }

        .team-input h3 {
            margin-bottom: 10px;
            color: var(--velvet-orchid);
        }

        .team-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .team-input select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 10px;
        }

        .start-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--velvet-orchid) 0%, var(--indigo) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.5em;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        .game-screen {
            display: none;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .team-score {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .team-score:hover {
            transform: translateY(-3px);
        }

        .team-score.active {
            border: 3px solid var(--pumpkin-spice);
            box-shadow: 0 0 20px rgba(255, 111, 0, 0.5);
        }

        .team-score h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .team-score .score {
            font-size: 2em;
            font-weight: bold;
            color: var(--velvet-orchid);
        }

        .team-score .emblem {
            font-size: 3em;
            margin: 10px 0;
        }

        .game-area {
            background: white;
            border-radius: 15px;
            padding: 40px;
            min-height: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .game-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .game-btn {
            padding: 30px;
            background: linear-gradient(135deg, var(--brick-ember) 0%, var(--burgundy) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .game-btn:hover {
            transform: translateY(-5px);
        }

        .wheel-container {
            text-align: center;
        }

        .wheel {
            width: 300px;
            height: 300px;
            border: 10px solid var(--velvet-orchid);
            border-radius: 50%;
            margin: 20px auto;
            position: relative;
            background: conic-gradient(
                var(--brick-ember) 0deg 90deg,
                var(--pumpkin-spice) 90deg 180deg,
                var(--lilac) 180deg 270deg,
                var(--velvet-orchid) 270deg 360deg
            );
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .word-display {
            font-size: 2em;
            letter-spacing: 10px;
            margin: 30px 0;
            font-family: monospace;
        }

        .letter-box {
            display: inline-block;
            width: 40px;
            height: 50px;
            border: 2px solid #333;
            margin: 0 3px;
            line-height: 50px;
            text-align: center;
            background: white;
        }

        .keyboard {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .key {
            padding: 15px 20px;
            background: var(--velvet-orchid);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        .key:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .guillotine-word {
            font-size: 2.5em;
            text-align: center;
            margin: 30px 0;
            color: var(--velvet-orchid);
        }

        .clue-list {
            list-style: none;
            padding: 0;
        }

        .clue-list li {
            background: #f8f9ff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid var(--velvet-orchid);
        }

        .answer-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid var(--velvet-orchid);
            border-radius: 10px;
            margin: 20px 0;
        }

        .btn {
            padding: 15px 30px;
            background: var(--velvet-orchid);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            margin: 10px;
        }

        .btn:hover {
            background: var(--indigo);
        }

        .hidden {
            display: none;
        }

        .number-question {
            font-size: 2.5em;
            text-align: center;
            margin: 40px 0;
            color: var(--velvet-orchid);
            min-height: 150px;
        }

        .timer {
            font-size: 3em;
            color: var(--brick-ember);
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .score-input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .score-input-box {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid var(--velvet-orchid);
        }

        .score-input-box input {
            width: 100%;
            padding: 10px;
            font-size: 1.2em;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 10px;
        }

        .speed-question {
            font-size: 2em;
            text-align: center;
            margin: 40px 0;
            min-height: 100px;
        }

        .tf-buttons {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin: 40px 0;
        }

        .tf-btn {
            padding: 40px 80px;
            font-size: 2em;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .true-btn {
            background: var(--pumpkin-spice);
            color: white;
        }

        .false-btn {
            background: var(--brick-ember);
            color: white;
        }

        .tf-btn:hover {
            transform: scale(1.1);
        }

        .quote-match-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            min-height: 500px;
        }

        .characters-list {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
        }

        .character-slot {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            border: 2px solid var(--velvet-orchid);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        .character-slot.has-quote {
            background: #e8f5e9;
            border-color: var(--pumpkin-spice);
        }

        .quote-area {
            background: #fff9e6;
            padding: 30px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .quote-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            border: 3px dashed var(--velvet-orchid);
            font-size: 1.4em;
            font-style: italic;
            cursor: move;
            text-align: center;
            max-width: 600px;
        }

        .quote-box.dragging {
            opacity: 0.5;
        }

        .character-slot.drag-over {
            background: #ffe6e6;
            border-color: var(--brick-ember);
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 30px auto;
        }

        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--velvet-orchid) 0%, var(--indigo) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            color: white;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .memory-card:hover {
            transform: scale(1.05);
        }

        .memory-card.flipped {
            background: white;
            color: #333;
            border: 3px solid var(--velvet-orchid);
        }

        .memory-card.matched {
            background: var(--pumpkin-spice);
            color: white;
            cursor: default;
        }

        .scramble-word {
            font-size: 3em;
            letter-spacing: 15px;
            text-align: center;
            color: var(--velvet-orchid);
            margin: 40px 0;
            font-family: monospace;
        }

        .scramble-input {
            width: 80%;
            max-width: 500px;
            padding: 20px;
            font-size: 1.5em;
            text-align: center;
            border: 3px solid var(--velvet-orchid);
            border-radius: 10px;
            display: block;
            margin: 30px auto;
        }

        .correct-answer {
            font-size: 3em;
            color: var(--pumpkin-spice);
            text-align: center;
            margin: 30px 0;
            font-weight: bold;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--burgundy);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 1.1em;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Romeo & Juliet Challenge 🎭</h1>

        <!-- Setup Screen -->
        <div class="setup-screen" id="setupScreen">
            <h2 style="text-align: center; margin-bottom: 30px;">Create Your Teams</h2>
            <div class="team-setup">
                <div class="team-input">
                    <h3>Team 1: Montagues ⚔️</h3>
                    <input type="text" id="team1Name" placeholder="Team Name" value="Montagues">
                    <select id="team1Emblem">
                        <option value="🦁">🦁 Lion</option>
                        <option value="🗡️">🗡️ Sword</option>
                        <option value="👑">👑 Crown</option>
                        <option value="🛡️">🛡️ Shield</option>
                        <option value="⚔️">⚔️ Crossed Swords</option>
                    </select>
                </div>
                <div class="team-input">
                    <h3>Team 2: Capulets 🏰</h3>
                    <input type="text" id="team2Name" placeholder="Team Name" value="Capulets">
                    <select id="team2Emblem">
                        <option value="🦅">🦅 Eagle</option>
                        <option value="🏰">🏰 Castle</option>
                        <option value="💎">💎 Diamond</option>
                        <option value="🌹">🌹 Rose</option>
                        <option value="👑">👑 Crown</option>
                    </select>
                </div>
                <div class="team-input">
                    <h3>Team 3: The Prince's Court 👨‍⚖️</h3>
                    <input type="text" id="team3Name" placeholder="Team Name" value="The Court">
                    <select id="team3Emblem">
                        <option value="⚖️">⚖️ Scales</option>
                        <option value="📜">📜 Scroll</option>
                        <option value="🎭">🎭 Theatre Masks</option>
                        <option value="✨">✨ Stars</option>
                        <option value="🕊️">🕊️ Dove</option>
                    </select>
                </div>
                <div class="team-input">
                    <h3>Team 4: Star-Crossed Lovers 💫</h3>
                    <input type="text" id="team4Name" placeholder="Team Name" value="Star-Crossed">
                    <select id="team4Emblem">
                        <option value="💖">💖 Heart</option>
                        <option value="💫">💫 Stars</option>
                        <option value="🌙">🌙 Moon</option>
                        <option value="🌟">🌟 Shining Star</option>
                        <option value="💕">💕 Two Hearts</option>
                    </select>
                </div>
            </div>
            <button class="start-btn" onclick="startGame()">Start the Challenge! ⚔️</button>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
            <div class="scoreboard" id="scoreboard"></div>
            
            <div class="game-area" id="gameArea">
                <h2 style="text-align: center; margin-bottom: 30px;">Choose Your Game</h2>
                <div class="game-menu">
                    <button class="game-btn" onclick="startNumberGame()">🔢 The Number Game</button>
                    <button class="game-btn" onclick="startSpeedRound()">⚡ Speed Round</button>
                    <button class="game-btn" onclick="startQuoteMatch()">💬 Quote Match</button>
                    <button class="game-btn" onclick="startMemoryGame()">🃏 Memory Pairs</button>
                    <button class="game-btn" onclick="startWordScramble()">🔤 Word Scramble</button>
                    <button class="game-btn" onclick="startWheelGame()">🎡 The Hangman</button>
                    <button class="game-btn" onclick="startGuillotineGame()">🎯 The Final Choice</button>
                    <button class="game-btn" onclick="startGrammarGame()">📝 Grammar Challenge</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        Created by Ms Fatigato 🎭
    </footer>

    <script>
        let teams = [];
        let currentTeamIndex = 0;

        function startGame() {
            teams = [
                {
                    name: document.getElementById('team1Name').value,
                    emblem: document.getElementById('team1Emblem').value,
                    score: 0
                },
                {
                    name: document.getElementById('team2Name').value,
                    emblem: document.getElementById('team2Emblem').value,
                    score: 0
                },
                {
                    name: document.getElementById('team3Name').value,
                    emblem: document.getElementById('team3Emblem').value,
                    score: 0
                },
                {
                    name: document.getElementById('team4Name').value,
                    emblem: document.getElementById('team4Emblem').value,
                    score: 0
                }
            ];

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            updateScoreboard();
        }

        function updateScoreboard() {
            const scoreboard = document.getElementById('scoreboard');
            scoreboard.innerHTML = teams.map((team, index) => `
                <div class="team-score ${index === currentTeamIndex ? 'active' : ''}" onclick="switchTeam(${index})">
                    <div class="emblem">${team.emblem}</div>
                    <h3>${team.name}</h3>
                    <div class="score">${team.score}</div>
                </div>
            `).join('');
        }

        function switchTeam(index) {
            currentTeamIndex = index;
            updateScoreboard();
        }

        function showScoreboard() {
            document.getElementById('gameArea').innerHTML = `
                <h2 style="text-align: center; margin-bottom: 30px;">Choose Your Game</h2>
                <div class="game-menu">
                    <button class="game-btn" onclick="startNumberGame()">🔢 The Number Game</button>
                    <button class="game-btn" onclick="startSpeedRound()">⚡ Speed Round</button>
                    <button class="game-btn" onclick="startQuoteMatch()">💬 Quote Match</button>
                    <button class="game-btn" onclick="startMemoryGame()">🃏 Memory Pairs</button>
                    <button class="game-btn" onclick="startWordScramble()">🔤 Word Scramble</button>
                    <button class="game-btn" onclick="startWheelGame()">🎡 The hangman</button>
                    <button class="game-btn" onclick="startGuillotineGame()">🎯 The Final Choice</button>
                    <button class="game-btn" onclick="startGrammarGame()">📝 Grammar Challenge</button>
                </div>
            `;
        }

        // NUMBER GAME
        const numberQuestions = [
            { question: "How old is Juliet?", answer: 13 },
            { question: "How many days does the story last?", answer: 5 },
            { question: "How many people die in the play?", answer: 6 },
            { question: "In which ACT does Romeo meet Juliet?", answer: 1 },
            { question: "How many feuding families are there?", answer: 2 }
        ];

        function startNumberGame() {
            const question = numberQuestions[Math.floor(Math.random() * numberQuestions.length)];
            let timeLeft = 10;
            let timerInterval;

            document.getElementById('gameArea').innerHTML = `
                <div style="text-align: center;">
                    <h2>🔢 The Number Game</h2>
                    <div class="timer" id="timer">10</div>
                    <div class="number-question">${question.question}</div>
                    <p style="font-size: 1.3em; color: #666;">Students write their answers on paper!</p>
                    <button class="btn" id="startTimerBtn" onclick="startTimer()">Start Timer</button>
                    <div id="answerReveal" style="display: none;">
                        <div class="correct-answer">Answer: ${question.answer}</div>
                    </div>
                    <div id="inputSection" style="display: none;">
                        <h3 style="margin: 30px 0;">Enter Team Answers:</h3>
                        <div class="score-input-grid">
                            ${teams.map((team, i) => `
                                <div class="score-input-box">
                                    <strong>${team.emblem} ${team.name}</strong>
                                    <input type="number" id="answer${i}" placeholder="Answer">
                                </div>
                            `).join('')}
                        </div>
                        <button class="btn" onclick="checkNumberAnswers(${question.answer})">Check Answers</button>
                    </div>
                    <button class="btn" onclick="showScoreboard()">Back to Menu</button>
                </div>
            `;

            window.startTimer = function() {
                document.getElementById('startTimerBtn').disabled = true;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        document.getElementById('timer').textContent = "TIME'S UP!";
                        setTimeout(() => {
                            document.getElementById('answerReveal').style.display = 'block';
                            setTimeout(() => {
                                document.getElementById('inputSection').style.display = 'block';
                            }, 1000);
                        }, 1000);
                    }
                }, 1000);
            };
        }

        function checkNumberAnswers(correctAnswer) {
            teams.forEach((team, i) => {
                const answer = parseInt(document.getElementById(`answer${i}`).value);
                const diff = Math.abs(answer - correctAnswer);
                if (diff === 0) {
                    team.score += 50;
                } else if (diff === 1) {
                    team.score += 30;
                } else if (diff === 2) {
                    team.score += 10;
                }
            });
            updateScoreboard();
            alert(`Correct answer was: ${correctAnswer}\nScores updated!`);
            showScoreboard();
        }

// SPEED ROUND con bonus velocità
const speedQuestions = [
    { question: "Romeo is a Capulet", answer: false },
    { question: "Juliet drinks poison to die", answer: false },
    { question: "Mercutio is killed by Tybalt", answer: true },
    { question: "The story is set in Venice", answer: false },
    { question: "Romeo and Juliet get married in secret", answer: true },
    { question: "Juliet is 16 years old", answer: false },
    { question: "Friar Lawrence helps the lovers", answer: true },
    { question: "Paris wants to marry Juliet", answer: true },
    { question: "Benvolio is Romeo's enemy", answer: false },
    { question: "The play ends happily", answer: false }
];

function startSpeedRound() {
    let currentQ = 0;
    let score = 0;
    let questionStartTime;
    const timePerQuestion = 10; // 10 secondi per domanda

    function showQuestion() {
        if (currentQ >= speedQuestions.length) {
            teams[currentTeamIndex].score += score;
            updateScoreboard();
            alert(`${teams[currentTeamIndex].name} scored ${score} points!`);
            currentTeamIndex = (currentTeamIndex + 1) % teams.length;
            updateScoreboard();
            showScoreboard();
            return;
        }

        const q = speedQuestions[currentQ];
        questionStartTime = Date.now(); // Inizia a contare il tempo
        let timeLeft = timePerQuestion;
        let countdown;

        document.getElementById('gameArea').innerHTML = `
            <div style="text-align: center;">
                <h2>⚡ Speed Round</h2>
                <p><strong>Team:</strong> ${teams[currentTeamIndex].name} ${teams[currentTeamIndex].emblem}</p>
                <p style="font-size: 1.2em; margin: 20px 0;">Question ${currentQ + 1} of ${speedQuestions.length}</p>
                <div class="timer" id="speedTimer" style="font-size: 2em; color: var(--pumpkin-spice);">${timeLeft}s</div>
                <p style="font-size: 1.2em; margin: 20px 0;">Current Score: ${score} points</p>
                <div class="speed-question">${q.question}</div>
                <div class="tf-buttons">
                    <button class="tf-btn true-btn" onclick="answerSpeed(true)">TRUE</button>
                    <button class="tf-btn false-btn" onclick="answerSpeed(false)">FALSE</button>
                </div>
                <p style="margin-top: 20px; font-size: 0.9em; color: #666;">
                    ⚡ Answer quickly for bonus points! ⚡<br>
                    Instant: +15 pts | Fast (1-3s): +12 pts | Medium (4-6s): +10 pts | Slow (7-10s): +7 pts
                </p>
            </div>
        `;

        // Countdown visivo
        countdown = setInterval(() => {
            timeLeft--;
            const timerEl = document.getElementById('speedTimer');
            if (timerEl) {
                timerEl.textContent = `${timeLeft}s`;
                // Cambia colore in base al tempo
                if (timeLeft <= 3) {
                    timerEl.style.color = 'var(--brick-ember)';
                } else if (timeLeft <= 6) {
                    timerEl.style.color = 'var(--pumpkin-spice)';
                }
            }
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                alert("Time's up! No points for this question.");
                currentQ++;
                showQuestion();
            }
        }, 1000);

        window.answerSpeed = function(answer) {
            clearInterval(countdown);
            
            const timeElapsed = (Date.now() - questionStartTime) / 1000; // tempo in secondi
            let points = 0;

            if (answer === q.answer) {
                // Calcola punti in base alla velocità
                if (timeElapsed < 1) {
                    points = 15; // Risposta istantanea!
                } else if (timeElapsed < 3) {
                    points = 12; // Molto veloce
                } else if (timeElapsed < 6) {
                    points = 10; // Veloce
                } else {
                    points = 7; // Lento ma corretto
                }
                score += points;
            } else {

                    alert(`⏰ Time's up!\n${teams[currentTeamIndex].name} earned ${pointsEarned} points!\n\nGame restarts from quote 1 for next team!`);

    };

    window.drag = function(ev) {
        ev.target.classList.add('dragging');

    window.drop = function(ev) {
        ev.preventDefault();
        ev.target.classList.remove('drag-over');
        const character = ev.target.dataset.character;
        const correctChar = quotes[currentQuoteIndex].character;

        if (character === correctChar) {

                charSlot.style.transform = 'scale(1.1)';

            setTimeout(() => {

                    charSlot.style.background = '';
                    charSlot.style.color = '';
                    charSlot.style.transform = '';
                }
                
                alert(`❌ Wrong!\n\nThe quote was from ${correctChar}, not ${character}.\n\n${teams[currentTeamIndex].name} earned ${pointsEarned} points and keeps them!\n\nGame restarts from quote 1 for next team!`);
                
                teamsAttempted.add(currentTeamIndex);
                
                if (teamsAttempted.size === teams.length) {
                    alert("All teams attempted but no one completed all quotes!\nGame over.");
                    showScoreboard();
                } else {
                    currentTeamIndex = (currentTeamIndex + 1) % teams.length;
                    while (teamsAttempted.has(currentTeamIndex)) {
                        currentTeamIndex = (currentTeamIndex + 1) % teams.length;
                    }
                    updateScoreboard();
                    startQuoteMatch(); // RICOMINCIA DA CAPO CON NUOVO TIMER
                }
            }, 1500);
        }
    };

    window.skipToNextTeam = function() {
        clearInterval(timerInterval);
        
        const pointsEarned = currentQuoteIndex * 10;
        
        alert(`${teams[currentTeamIndex].name} skipped and earned ${pointsEarned} points!\n\nGame restarts from quote 1 for next team!`);
        
        teamsAttempted.add(currentTeamIndex);
        
        if (teamsAttempted.size === teams.length) {
            alert("All teams have played. Game over.");
            showScoreboard();
        } else {
            currentTeamIndex = (currentTeamIndex + 1) % teams.length;
            while (teamsAttempted.has(currentTeamIndex)) {
                currentTeamIndex = (currentTeamIndex + 1) % teams.length;
            }
            updateScoreboard();
            startQuoteMatch(); // RICOMINCIA DA CAPO
        }
    };

    render();
}

        { id: 8, text: "Friar" }, { id: 8, text: "Lawrence" }
    ];

    let cards = [...pairs].sort(() => Math.random() - 0.5);
    let flipped = [];
    let matched = [];
    let moves = 0;

    function render() {
        document.getElementById('gameArea').innerHTML = `
            <div style="text-align: center;">
                <h2>🃏 Memory Pairs</h2>
                <p><strong>Team:</strong> ${teams[currentTeamIndex].name} ${teams[currentTeamIndex].emblem}</p>

                    💎 +10 points for each pair found!
                </p>
                <div class="memory-grid">
                    ${cards.map((card, index) => `
                        <div class="memory-card ${flipped.includes(index) || matched.includes(index) ? 'flipped' : ''} 
                             ${matched.includes(index) ? 'matched' : ''}"
                             onclick="flipCard(${index})">
                            ${flipped.includes(index) || matched.includes(index) ? card.text : '?'}
                        </div>
                    `).join('')}
                </div>
                <button class="btn" onclick="showScoreboard()">Back to Menu</button>
            </div>
        `;
    }

    window.flipCard = function(index) {
        if (flipped.length >= 2 || flipped.includes(index) || matched.includes(index)) return;

        flipped.push(index);
        render();

        if (flipped.length === 2) {
            moves++;
            const [first, second] = flipped;
            
            if (cards[first].id === cards[second].id) {
                // COPPIA TROVATA! +10 punti
                matched.push(first, second);

                flipped = [];

                        alert(`🎉 All pairs found!\n\n💎 Pairs bonus: ${(matched.length / 2) * 10} points\n🏆 Completion bonus: +${bonusPoints} points\n📊 Total moves: ${moves}`);
                        currentTeamIndex = (currentTeamIndex + 1) % teams.length;
                        updateScoreboard();
                        showScoreboard();
                    }, 500);
                } else {
                    // Feedback positivo per la coppia trovata
                    setTimeout(() => {
                        alert(`✅ Match found! +10 points`);
                        render();
                    }, 300);
                }
            } else {
                // ERRORE! Cambia squadra
                setTimeout(() => {
                    flipped = [];
                    currentTeamIndex = (currentTeamIndex + 1) % teams.length;
                    updateScoreboard();
                    render();
                }, 1000);
            }
        }
    };

// GRAMMAR CHALLENGE - Timer-based con passaggio turno

function startGrammarGame() {
    let availableQuestions = [...grammarQuestions]; // Copia di tutte le domande
    let usedQuestions = []; // Domande già usate
    let teamScores = teams.map(() => 0); // Punteggi per team in questo round
    let teamsFinished = new Set(); // Squadre che hanno finito il loro turno
    let timeLeft = 40;
    let timerInterval;

    function playTurn() {
        // Se tutte le squadre hanno giocato, finisci il gioco
        if (teamsFinished.size === teams.length) {
            // Assegna i punteggi finali
            teams.forEach((team, index) => {
                team.score += teamScores[index];
            });
            updateScoreboard();
            
            // Mostra classifica finale del round
            let results = teams.map((team, i) => 
                `${team.emblem} ${team.name}: ${teamScores[i]} points`
            ).join('\n');
            alert(`📝 Grammar Challenge Complete!\n\n${results}`);
            showScoreboard();
            return;
        }

        // Salta le squadre che hanno già finito
        while (teamsFinished.has(currentTeamIndex)) {
            currentTeamIndex = (currentTeamIndex + 1) % teams.length;
        }

        timeLeft = 40;
        let currentQuestion;

        function getNextQuestion() {
            // Prima prova con domande non usate
            if (availableQuestions.length > 0) {
                const index = Math.floor(Math.random() * availableQuestions.length);
                currentQuestion = availableQuestions[index];
                availableQuestions.splice(index, 1);
                usedQuestions.push(currentQuestion);
                return true;
            } 
            // Se finite le nuove, usa quelle già usate
            else if (usedQuestions.length > 0) {
                const index = Math.floor(Math.random() * usedQuestions.length);
                currentQuestion = usedQuestions[index];
                return true;
            }
            return false;
        }

        function showQuestion() {
            if (!getNextQuestion()) {
                alert("No more questions available!");
                teamsFinished.add(currentTeamIndex);
                currentTeamIndex = (currentTeamIndex + 1) % teams.length;
                updateScoreboard();
                playTurn();
                return;
            }

            document.getElementById('gameArea').innerHTML = `
                <div style="text-align: center;">
                    <h2>📝 Grammar Challenge</h2>
                    <p><strong>Current Team:</strong> ${teams[currentTeamIndex].name} ${teams[currentTeamIndex].emblem}</p>
                    <div class="timer" id="grammarTimer" style="font-size: 2.5em; margin: 20px 0;">${timeLeft}s</div>
                    <p style="font-size: 1.1em; margin: 10px 0; color: var(--velvet-orchid);">
                        Score this turn: ${teamScores[currentTeamIndex]} points
                    </p>
                    <p style="font-size: 0.9em; color: #666; margin-bottom: 20px;">
                        ${availableQuestions.length > 0 
                            ? `📋 ${availableQuestions.length} fresh questions left` 
                            : '🔄 Recycling answered questions'}
                    </p>
                    <h3 style="margin: 40px 0; font-size: 1.8em;">${currentQuestion.text}</h3>
                    <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
                        ${currentQuestion.options.map(option => 
                            `<button class="btn" style="padding: 20px 40px; font-size: 1.5em;" 
                                onclick="checkAnswer('${option}')">${option}</button>`
                        ).join('')}
                    </div>
                    <p style="margin-top: 30px; font-size: 0.9em; color: #999;">
                        ⚠️ Wrong answer = lose your turn!
                    </p>
                </div>
            `;

            // Avvia il timer se non è già attivo
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    const timerEl = document.getElementById('grammarTimer');
                    if (timerEl) {
                        timerEl.textContent = `${timeLeft}s`;
                        if (timeLeft <= 10) {
                            timerEl.style.color = 'var(--brick-ember)';
                        }
                    }
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        alert(`⏰ Time's up!\n${teams[currentTeamIndex].name} scored ${teamScores[currentTeamIndex]} points this turn!`);
                        teamsFinished.add(currentTeamIndex);
                        currentTeamIndex = (currentTeamIndex + 1) % teams.length;
                        updateScoreboard();
                        playTurn();
                    }
                }, 1000);
            }
        }

        window.checkAnswer = function(selected) {
            if (selected === currentQuestion.correct) {
                // Risposta corretta! +10 punti e prossima domanda
                teamScores[currentTeamIndex] += 10;
                setTimeout(() => {
                    showQuestion();
                }, 300);
            } else {
                // Risposta sbagliata! Perde il turno
                clearInterval(timerInterval);
                timerInterval = null;
                alert(`❌ Wrong!\n${teams[currentTeamIndex].name} scored ${teamScores[currentTeamIndex]} points this turn.\nNext team!`);
                teamsFinished.add(currentTeamIndex);
                currentTeamIndex = (currentTeamIndex + 1) % teams.length;
                updateScoreboard();
                playTurn();
            }
        };

        showQuestion();
    }

    playTurn();
}
    </script>
